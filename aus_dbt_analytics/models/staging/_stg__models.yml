version: 2

models:
  - name: stg_transactions
    description: |
      Cleaned, typed transaction records. One row per non-declined,
      positive-amount transaction. Source: raw.transactions (loaded by
      aus-banking-pipeline's Airflow DAG).
    columns:
      - name: transaction_id
        description: Surrogate primary key from the source system.
        tests:
          - not_null
          - unique
      - name: account_id
        description: FK to stg_accounts.account_id.
        tests:
          - not_null
          - relationships:
              to: ref('stg_accounts')
              field: account_id
      - name: transaction_date
        description: Date of the transaction (UTC).
        tests:
          - not_null
      - name: amount
        description: Absolute transaction amount in AUD (always positive).
        tests:
          - not_null
          - dbt_utils.expression_is_true:
              expression: ">= 0"
      - name: transaction_type
        tests:
          - not_null
          - accepted_values:
              values: ['DEBIT', 'CREDIT']
      - name: channel
        tests:
          - accepted_values:
              values: ['EFTPOS', 'ONLINE', 'ATM', 'BPAY']

  - name: stg_accounts
    description: Cleaned account dimension. One row per active account.
    columns:
      - name: account_id
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
      - name: account_type
        tests:
          - accepted_values:
              values: ['SAVINGS', 'TRANSACTION', 'OFFSET']
      - name: bsb
        description: |
          Australian Bank State Branch code. Always six digits formatted
          NNN-NNN; a malformed BSB means the row can't be routed and should
          fail the build rather than land in the marts.
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              regex: "^[0-9]{3}-[0-9]{3}$"
      - name: open_date
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: "'1980-01-01'::date"
              max_value: "current_date"