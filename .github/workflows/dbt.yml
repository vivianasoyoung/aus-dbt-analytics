name: dbt CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aus_pipeline
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aus_pipeline
      DBT_PROFILES_DIR: ${{ github.workspace }}/aus_dbt_analytics

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt
        run: pip install "dbt-postgres==1.9.1"

      - name: Seed raw schema + fixture data
        run: psql "postgresql://postgres:postgres@localhost:5432/aus_pipeline" -f .github/fixtures/seed_raw.sql

      - name: Render profiles.yml
        run: cp profiles.example.yml aus_dbt_analytics/profiles.yml

      - name: dbt deps
        working-directory: aus_dbt_analytics
        run: dbt deps

      - name: dbt build
        working-directory: aus_dbt_analytics
        run: dbt build

      - name: Generate dbt docs
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: aus_dbt_analytics
        run: dbt docs generate

      - name: Deploy docs to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: aus_dbt_analytics/target
